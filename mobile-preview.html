<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Woobi Mobile App Live Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0f1115;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px 16px 16px;
      scrollbar-width: none;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    .header-bar {
      text-align: center;
      margin-bottom: 10px;
      max-width: 600px;
    }
    .badge-pill {
      display: inline-block;
      padding: 3px 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(163, 230, 53, 0.15);
      color: #a3e635;
      border: 1px solid rgba(163, 230, 53, 0.35);
      border-radius: 9999px;
      margin-bottom: 4px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 2px;
    }
    p.subtitle {
      font-size: 0.82rem;
      color: #94a3b8;
    }
    .controls-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 12px;
      background: #1a1e26;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .btn-action {
      background: #262c38;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-action:hover {
      background: #333b4b;
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }
    .btn-action.active-mode {
      background: #4f46e5;
      border-color: #6366f1;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    }
    .btn-action.btn-green {
      background: #15803d;
      border-color: #22c55e;
      color: #ffffff;
    }
    .btn-action.btn-green:hover {
      background: #16a34a;
    }

    /* Clean Borderless Container */
    .phone-mockup-wrapper {
      position: relative;
      width: 412px;
      max-width: 95vw;
      height: calc(100vh - 140px);
      background: #000000;
      border-radius: 20px;
      padding: 0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: none !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    /* Screen Frame */
    .phone-screen-frame {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: #000000;
      position: relative;
      border: none !important;
    }
    iframe#appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000000;
    }

    .footer-notes {
      margin-top: 20px;
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
    }
    .footer-notes a {
      color: #a3e635;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-notes a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="badge-pill">Mobile Testing Studio</div>
    <h1>Woobi Mobile Intro & Navigation Flow</h1>
    <p class="subtitle">Simulate both First-Time Download and Returning User experiences.</p>
  </div>

  <div class="controls-panel">
    <button type="button" class="btn-action active-mode" id="btnReturningUser" onclick="loadMode('returning')">
      <span>🔄</span> Test Returning User (Video ➔ Curtains ➔ Home)
    </button>
    <button type="button" class="btn-action" id="btnFirstTimeUser" onclick="loadMode('first')">
      <span>✨</span> Test First-Time User (Video ➔ Curtains ➔ Login ➔ Enter Woobi ➔ Home)
    </button>
    <button type="button" class="btn-action" onclick="reloadFrame()">
      <span>🔁</span> Replay
    </button>
    <a href="/?intro=1" target="_blank" class="btn-action btn-green">
      <span>↗</span> Open Fullscreen
    </a>
  </div>

  <div class="phone-mockup-wrapper">
    <div class="phone-screen-frame">
      <iframe id="appFrame" src="/?intro=1&preview=1&user=returning" allow="camera; autoplay; encrypted-media"></iframe>
    </div>
  </div>

  <div class="footer-notes">
    Direct full-window links: 
    <a href="/?intro=1&user=returning" target="_blank">Returning User Flow</a> • 
    <a href="/?intro=1&user=first" target="_blank">First-Time User Flow</a>
  </div>

  <script>
    var currentMode = 'returning';

    function loadMode(mode) {
      currentMode = mode;
      document.getElementById('btnReturningUser').classList.toggle('active-mode', mode === 'returning');
      document.getElementById('btnFirstTimeUser').classList.toggle('active-mode', mode === 'first');
      var frame = document.getElementById('appFrame');
      frame.src = '/?intro=1&preview=1&user=' + mode + '&t=' + Date.now();
    }

    function reloadFrame() {
      var frame = document.getElementById('appFrame');
      frame.src = '/?intro=1&preview=1&user=' + currentMode + '&t=' + Date.now();
    }
  </script>
</body>
</html>
