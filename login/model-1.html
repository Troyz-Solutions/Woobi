<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Woobi — Welcome to your everyday</title>
  <link rel="stylesheet" href="model-1.css">
  <link rel="stylesheet" href="auth-feedback.css">
  <script src="firebase-config.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="login-shell">
    <aside class="garden" aria-label="Woobi virtual styling studio">
      <svg class="studio-portrait" viewBox="180 85 220 514" preserveAspectRatio="xMidYMin slice" role="img" aria-label="Woobi’s warm fashion studio and styled model">
        <defs><clipPath id="portrait-crop"><rect x="180" y="0" width="220" height="599" /></clipPath></defs>
        <image href="../assets/seren_studio_room.jpg" width="400" height="599" clip-path="url(#portrait-crop)" />
      </svg>
      <div class="studio-label"><span>sérén</span><span>STUDIO</span></div>
    </aside>
    <section class="form-panel" aria-labelledby="form-title">
      <div class="topline"><a class="brand" href="../index.html" aria-label="Woobi home">woobi<span>VIRTUAL STYLING</span></a><a href="../index.html">Explore Woobi <span aria-hidden="true">↗</span></a></div>
      <div class="form-content">
        <span class="small-flower" aria-hidden="true">✧</span>
        <p class="eyebrow">MAKE YOURSELF AT HOME</p>
        <h2 id="form-title">Welcome back.</h2>
        <p class="intro" id="form-intro">Your wardrobe is waiting. Let’s make it a good day.</p>
        <form id="auth-form" novalidate>
          <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="email-error"><span class="field-error" id="email-error"></span></div>
          <div class="field" id="password-field"><div class="label-row"><label for="password">Password</label><button class="text-button" id="forgot" type="button">Forgot password?</button></div><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required aria-describedby="password-error"><button id="toggle-password" type="button" aria-label="Show password" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><span class="field-error" id="password-error"></span></div>
          <p id="status" class="status" role="status" aria-live="polite" hidden></p>
          <button class="primary" id="submit" type="submit"><span id="submit-label">Log in</span><span aria-hidden="true">↗</span></button>
        </form>
        <div id="social-section"><div class="divider"><span>or continue with</span></div><button class="google" id="google" type="button"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.36Z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.24-2.51c-.9.6-2.04.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.07v2.59A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.41 13.92A6 6 0 0 1 6.1 12c0-.67.11-1.32.31-1.92V7.49H3.07A10 10 0 0 0 2 12c0 1.61.39 3.14 1.07 4.51l3.34-2.59Z"/><path fill="#EA4335" d="M12 5.96c1.47 0 2.79.51 3.82 1.51l2.87-2.87A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.93 5.49l3.34 2.59A6 6 0 0 1 12 5.96Z"/></svg>Continue with Google</button></div>
        <p class="switch-copy"><span id="switch-prompt">New to Woobi?</span> <button class="text-button" id="switch-mode" type="button">Create an account <span aria-hidden="true">↗</span></button></p>
        <p class="config-note" id="config-note" hidden>Design preview · Firebase setup pending</p>
      </div>
      <footer><span>A little less “what to wear?”</span><span>A little more you. <span aria-hidden="true">✳</span></span></footer>
    </section>
  </main>
</body>
</html>
