name: Woobi CI & Release Gate

on:
  push:
    branches:
      - main
      - 'integration/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-architecture:
    name: Architecture & Boundary Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Monorepo Boundary & Circular Dependency Validator
        shell: pwsh
        run: |
          ./scripts/validation/validate-boundaries.ps1

  test-3d-studio:
    name: 3D Studio, Features, Settings, Backend & Multi-Process Hardening Suite (642 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Master Test Suite (3D Studio, Features, Settings & Hardened Backend)
        run: |
          node scripts/testing/run-all-tests.js

      - name: Execute Real Backend HTTP E2E Integration Suite (14 Scenarios)
        run: |
          node scripts/testing/test-backend-e2e.js

  verify-assets:
    name: Git LFS & Asset Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Git LFS Assets
        shell: pwsh
        run: |
          $requiredAssets = @(
            "seren_stage.glb",
            "wardrobe.glb",
            "seren_vanity.glb",
            "seren_avatar.glb"
          )
          $failed = $false
          foreach ($asset in $requiredAssets) {
            $files = Get-ChildItem -Path . -Filter $asset -Recurse
            if ($files.Count -eq 0) {
              Write-Error "Required asset '$asset' not found in repository."
              $failed = $true
            } else {
              foreach ($file in $files) {
                if ($file.Length -lt 100000) {
                  Write-Error "Asset '$($file.FullName)' appears to be an unresolved LFS pointer ($($file.Length) bytes)."
                  $failed = $true
                } else {
                  Write-Host "✓ Valid asset '$($file.Name)' ($($file.Length) bytes)"
                }
              }
            }
          }
          if (Test-Path "server.exe") {
            Write-Error "Deprecated binary 'server.exe' detected in repository root!"
            $failed = $true
          }
          if ($failed) {
            exit 1
          }

  build-android:
    name: Android Native Build (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x android-app/gradlew

      - name: Build Android Debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Generated APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path android-app/app/build/outputs/apk/debug/*.apk
          if ($apk) {
            Write-Host "✓ Successfully generated APK: $($apk.Name) ($($apk.Length) bytes)"
          } else {
            Write-Error "assembleDebug completed but APK artifact not found."
            exit 1
          }
